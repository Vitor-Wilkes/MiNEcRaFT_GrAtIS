<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Grátis - Download</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            height: 100vh;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        /* Container do fundo */
        #conteudo-fundo {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.5s ease;
        }

        .fundo-desfocado {
            filter: blur(8px);
        }

        /* Botão Inicial */
        #btn-download {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border: 5px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            text-transform: uppercase;
            z-index: 9999;
        }

        /* Barra de Carregamento */
        #loading-container {
            display: none;
            width: 80%;
            max-width: 500px;
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #444;
            text-align: center;
            color: white;
            z-index: 9998;
        }
        #loading-text { font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        #progress-bar { width: 100%; background-color: #333; height: 25px; border-radius: 5px; overflow: hidden; border: 1px solid #555; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc, #0099ff); transition: width 0.1s linear; }

        /* Imagens do Cachorro Louco */
        .cachorro-louco {
            position: absolute;
            transform-origin: center;
            animation: pulsarEfeito 1.2s infinite alternate ease-in-out;
            z-index: 5;
        }

        /* Pop-up do Freitas */
        #popup-freitas-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #popup-conteudo {
            background-color: #fff;
            color: #222;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 4px solid #cc0000;
        }

        #popup-conteudo h2 { color: #cc0000; margin-top: 0; font-size: 26px; }
        #popup-conteudo p { font-size: 16px; line-height: 1.4; margin-bottom: 20px; }

        #img-popup-freitas {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
        }

        #btn-prevenir {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #cc0000;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
        }

        /* Estilo do erro em cascata (Baseado na imagem enviada) */
        .foto-freitas {
            position: absolute;
            box-shadow: 10px 10px 25px rgba(0,0,0,0.5);
            border: 3px solid #ECE9D8; /* Borda cinza clássica de janela antiga */
            background-color: #ECE9D8;
            padding: 4px;
        }

        @keyframes pulsarEfeito {
            0% { transform: scale(0.85); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div id="conteudo-fundo">
        <button id="btn-download" onclick="iniciarJogo()">
            💥 CLIQUE AQUI PARA BAIXAR MINECRAFT GRÁTIS 💥
        </button>

        <div id="loading-container">
            <div id="loading-text">Baixando arquivos do jogo... 0%</div>
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
    </div>

    <div id="popup-freitas-wrapper">
        <div id="popup-conteudo">
            <h2>⚠️ ALERTA DE PERIGO ⚠️</h2>
            <img id="img-popup-freitas" src="freitas.png" alt="Freitas">
            <p>Você tentou escapar! O <strong>Freitas</strong> foi detectado a exatamente 1 metro de distância de você.</p>
            <button id="btn-prevenir" onclick="ativarTelaAzulFreitas()">Se Prevenir</button>
        </div>
    </div>

    <script>
        const imagemCachorro = 'cachorro_louco.png'; 
        const imagemFreitas = 'freitas.png';         

        let tempoVirus = 1500; 
        const tempoMinimoVirus = 40;  
        const fatorAceleracaoVirus = 0.85; 
        let progresso = 0;
        let virusAtivo = false;

        function iniciarJogo() {
            document.getElementById('btn-download').style.display = 'none';
            document.getElementById('loading-container').style.display = 'block';
            
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            document.addEventListener('fullscreenchange', monitorarTelaCheia);
            document.addEventListener('webkitfullscreenchange', monitorarTelaCheia);

            atualizarBarra();
        }

        function atualizarBarra() {
            if (progresso >= 100) {
                document.getElementById('loading-container').style.display = 'none';
                virusAtivo = true;
                criarCachorro(); 
                return;
            }

            progresso += 1;
            document.getElementById('progress-fill').style.width = progresso + '%';
            document.getElementById('loading-text').innerText = `Baixando arquivos do jogo... ${progresso}%`;

            let delay = 30;
            if (progresso === 34) delay = 1200;
            else if (progresso === 72) delay = 1800;
            else if (progresso >= 85) delay = 120;

            setTimeout(atualizarBarra, delay);
        }

        function criarCachorro() {
            if (!virusAtivo) return; 

            const img = document.createElement('img');
            img.src = imagemCachorro;
            img.classList.add('cachorro-louco');

            const tam = Math.floor(Math.random() * (140 - 60 + 1)) + 60;
            img.style.width = `${tam}px`;
            img.style.height = `auto`;

            img.style.left = `${Math.random() * (window.innerWidth - tam)}px`;
            img.style.top = `${Math.random() * (window.innerHeight - tam)}px`;
            img.style.animationDelay = `${Math.random() * 1}s`;

            document.getElementById('conteudo-fundo').appendChild(img);

            tempoVirus = Math.max(tempoMinimoVirus, tempoVirus * fatorAceleracaoVirus);
            setTimeout(criarCachorro, tempoVirus);
        }

        function monitorarTelaCheia() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                virusAtivo = false; 
                
                document.getElementById('conteudo-fundo').classList.add('fundo-desfocado');

                if(document.getElementById('btn-download')) document.getElementById('btn-download').style.display = 'none';
                if(document.getElementById('loading-container')) document.getElementById('loading-container').style.display = 'none';

                document.getElementById('popup-freitas-wrapper').style.display = 'flex';
            }
        }

        // CORRIGIDO: Nome da função ajustado para bater com o botão "Se Prevenir"
        function activarTelaAzulFreitas() {
            ativarTelaAzulFreitas();
        }

        function activarTelaAzulFreitas() { /* Mantendo compatibilidade caso chame duplicado */ }

        // Nova execução limpa do travamento em cascata
        let zIndexAtual = 20000;
        function ativarTelaAzulFreitas() {
            // Remove o pop-up da tela
            document.getElementById('popup-freitas-wrapper').style.display = 'none';
            
            // Remove os elementos antigos e deixa o fundo azul clássico de travamento
            document.getElementById('conteudo-fundo').remove();
            document.body.style.backgroundColor = '#0000aa'; 

            // Loop contínuo que spawna as imagens muito rápido (a cada 50ms)
            setInterval(() => {
                const img = document.createElement('img');
                img.src = imagemFreitas;
                img.classList.add('foto-freitas');

                // Define tamanhos médios/grandes variados para simular janelas de erro
                const tam = Math.floor(Math.random() * (400 - 250 + 1)) + 250;
                img.style.width = `${tam}px`;
                img.style.height = `auto`;

                // Posiciona aleatoriamente na tela
                img.style.left = `${Math.random() * (window.innerWidth - tam)}px`;
                img.style.top = `${Math.random() * (window.innerHeight - (tam * 0.7))}px`;

                // Incrementa o z-index para que cada nova foto fique obrigatoriamente na frente da anterior
                zIndexAtual++;
                img.style.zIndex = zIndexAtual;

                document.body.appendChild(img);
            }, 50); 
        }
    </script>

</body>
</html>
